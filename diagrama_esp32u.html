<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portón 433MHz — Diagrama ESP32-WROOM-32U (antena externa)</title>
<style>body{background:#0f1115;margin:0;display:flex;justify-content:center;padding:20px;}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 830" width="980" height="830" style="font-family:monospace,sans-serif">

  <rect width="980" height="830" fill="#0f1115"/>
  <text x="490" y="26" fill="#f1f5f9" font-size="15" text-anchor="middle" font-weight="bold">Portón 433MHz — ESP32-WROOM-32U (DevKit 38 pines)</text>
  <text x="490" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Texto blanco = pin usado · gris = pin libre · el color del recuadro indica el módulo (ver leyenda)</text>

  <!-- ===== Leyenda de categorías (arriba, clara) ===== -->
  <g font-size="9">
    <rect x="150" y="56" width="14" height="10" fill="#ef4444"/><text x="168" y="65" fill="#e6e6e6">5V</text>
    <rect x="200" y="56" width="14" height="10" fill="#f59e0b"/><text x="218" y="65" fill="#e6e6e6">3V3</text>
    <rect x="256" y="56" width="14" height="10" fill="#9ca3af"/><text x="274" y="65" fill="#e6e6e6">GND</text>
    <rect x="316" y="56" width="14" height="10" fill="#22d3ee"/><text x="334" y="65" fill="#e6e6e6">CC1101 (433MHz)</text>
    <rect x="446" y="56" width="14" height="10" fill="#3b82f6"/><text x="464" y="65" fill="#e6e6e6">Relay</text>
    <rect x="506" y="56" width="14" height="10" fill="#c084fc"/><text x="524" y="65" fill="#e6e6e6">DS3231 (I2C)</text>
    <rect x="616" y="56" width="14" height="10" fill="#64748b"/><text x="634" y="65" fill="#e6e6e6">interno</text>
  </g>

  <!-- ===== Antena WiFi 2.4GHz (U.FL / IPEX) ===== -->
  <line x1="470" y1="88" x2="418" y2="98" stroke="#22c55e" stroke-width="2"/>
  <circle cx="470" cy="88" r="4" fill="#22c55e"/>
  <text x="360" y="90" fill="#22c55e" font-size="9">Antena WiFi 2.4GHz</text>
  <text x="360" y="101" fill="#22c55e" font-size="9">(conector U.FL)</text>
  <rect x="455" y="94" width="30" height="14" rx="2" fill="#14321f" stroke="#22c55e" stroke-width="1.2"/>
  <text x="470" y="104" fill="#22c55e" font-size="7" text-anchor="middle">U.FL</text>

  <!-- ===== Placa ESP32-WROOM-32U ===== -->
  <rect x="380" y="110" width="180" height="690" rx="8" fill="#232a36" stroke="#4b5563" stroke-width="2"/>
  <rect x="410" y="122" width="120" height="46" rx="3" fill="#12161d" stroke="#3a3e48" stroke-width="1"/>
  <text x="470" y="140" fill="#e2e8f0" font-size="10" text-anchor="middle" font-weight="bold">ESP32-WROOM</text>
  <text x="470" y="154" fill="#22c55e" font-size="10" text-anchor="middle" font-weight="bold">-32U</text>
  <text x="470" y="165" fill="#94a3b8" font-size="7" text-anchor="middle">(módulo blindado + U.FL)</text>
  <rect x="435" y="810" width="70" height="16" rx="3" fill="#0f1115" stroke="#555" stroke-width="1"/>
  <text x="470" y="822" fill="#94a3b8" font-size="8" text-anchor="middle">USB</text>

  <!-- ===== PINES IZQUIERDA — recuadros de categoría (solo usados) ===== -->
  <g>
    <rect x="370" y="183" width="10" height="12" fill="#f59e0b"/>
    <rect x="370" y="381" width="10" height="12" fill="#22d3ee"/>
    <rect x="370" y="480" width="10" height="12" fill="#3b82f6"/>
    <rect x="370" y="513" width="10" height="12" fill="#22d3ee"/>
    <rect x="370" y="612" width="10" height="12" fill="#9ca3af"/>
    <rect x="370" y="777" width="10" height="12" fill="#ef4444"/>
  </g>
  <!-- ticks pines libres izq -->
  <g stroke="#4b5563" stroke-width="1.5">
    <line x1="373" y1="222" x2="380" y2="222"/><line x1="373" y1="255" x2="380" y2="255"/>
    <line x1="373" y1="288" x2="380" y2="288"/><line x1="373" y1="321" x2="380" y2="321"/>
    <line x1="373" y1="354" x2="380" y2="354"/><line x1="373" y1="420" x2="380" y2="420"/>
    <line x1="373" y1="453" x2="380" y2="453"/><line x1="373" y1="546" x2="380" y2="546"/>
    <line x1="373" y1="579" x2="380" y2="579"/><line x1="373" y1="645" x2="380" y2="645"/>
    <line x1="373" y1="678" x2="380" y2="678"/><line x1="373" y1="711" x2="380" y2="711"/>
    <line x1="373" y1="744" x2="380" y2="744"/>
  </g>
  <g font-size="9.5" text-anchor="end">
    <text x="366" y="192" fill="#f1f5f9" font-weight="bold">3V3   ▶ VCC CC1101 / DS3231</text>
    <text x="366" y="225" fill="#5b6470">EN</text>
    <text x="366" y="258" fill="#5b6470">GPIO36 (VP)</text>
    <text x="366" y="291" fill="#5b6470">GPIO39 (VN)</text>
    <text x="366" y="324" fill="#5b6470">GPIO34</text>
    <text x="366" y="357" fill="#5b6470">GPIO35</text>
    <text x="366" y="390" fill="#f1f5f9" font-weight="bold">GPIO32 ▶ GDO2  (TX 433)</text>
    <text x="366" y="423" fill="#5b6470">GPIO33</text>
    <text x="366" y="456" fill="#5b6470">GPIO25</text>
    <text x="366" y="489" fill="#f1f5f9" font-weight="bold">GPIO26 ▶ Relay IN</text>
    <text x="366" y="522" fill="#f1f5f9" font-weight="bold">GPIO27 ▶ GDO0  (RX 433)</text>
    <text x="366" y="555" fill="#5b6470">GPIO14</text>
    <text x="366" y="588" fill="#5b6470">GPIO12</text>
    <text x="366" y="621" fill="#f1f5f9" font-weight="bold">GND   ▶ tierra común</text>
    <text x="366" y="654" fill="#5b6470">GPIO13</text>
    <text x="366" y="687" fill="#5b6470">GPIO9</text>
    <text x="366" y="720" fill="#5b6470">GPIO10</text>
    <text x="366" y="753" fill="#5b6470">GPIO11</text>
    <text x="366" y="786" fill="#f1f5f9" font-weight="bold">5V(VIN) ◀ Fuente / Relay VCC</text>
  </g>

  <!-- ===== PINES DERECHA — recuadros de categoría (solo usados) ===== -->
  <g>
    <rect x="560" y="183" width="10" height="12" fill="#9ca3af"/>
    <rect x="560" y="216" width="10" height="12" fill="#22d3ee"/>
    <rect x="560" y="249" width="10" height="12" fill="#c084fc"/>
    <rect x="560" y="348" width="10" height="12" fill="#c084fc"/>
    <rect x="560" y="381" width="10" height="12" fill="#9ca3af"/>
    <rect x="560" y="414" width="10" height="12" fill="#22d3ee"/>
    <rect x="560" y="447" width="10" height="12" fill="#22d3ee"/>
    <rect x="560" y="480" width="10" height="12" fill="#22d3ee"/>
    <rect x="560" y="612" width="10" height="12" fill="#64748b"/>
    <rect x="560" y="645" width="10" height="12" fill="#64748b"/>
  </g>
  <g stroke="#4b5563" stroke-width="1.5">
    <line x1="560" y1="288" x2="567" y2="288"/><line x1="560" y1="321" x2="567" y2="321"/>
    <line x1="560" y1="513" x2="567" y2="513"/><line x1="560" y1="546" x2="567" y2="546"/>
    <line x1="560" y1="579" x2="567" y2="579"/><line x1="560" y1="678" x2="567" y2="678"/>
    <line x1="560" y1="711" x2="567" y2="711"/><line x1="560" y1="744" x2="567" y2="744"/>
  </g>
  <g font-size="9.5" text-anchor="start">
    <text x="574" y="192" fill="#f1f5f9" font-weight="bold">GND   ▶ tierra común</text>
    <text x="574" y="225" fill="#f1f5f9" font-weight="bold">GPIO23 ▶ MOSI</text>
    <text x="574" y="258" fill="#f1f5f9" font-weight="bold">GPIO22 ▶ SCL (DS3231)</text>
    <text x="574" y="291" fill="#5b6470">GPIO1 (TX0)</text>
    <text x="574" y="324" fill="#5b6470">GPIO3 (RX0)</text>
    <text x="574" y="357" fill="#f1f5f9" font-weight="bold">GPIO21 ▶ SDA (DS3231)</text>
    <text x="574" y="390" fill="#f1f5f9" font-weight="bold">GND   ▶ tierra común</text>
    <text x="574" y="423" fill="#f1f5f9" font-weight="bold">GPIO19 ▶ MISO</text>
    <text x="574" y="456" fill="#f1f5f9" font-weight="bold">GPIO18 ▶ SCK</text>
    <text x="574" y="489" fill="#f1f5f9" font-weight="bold">GPIO5  ▶ CSN</text>
    <text x="574" y="522" fill="#5b6470">GPIO17 (TX2)</text>
    <text x="574" y="555" fill="#5b6470">GPIO16 (RX2)</text>
    <text x="574" y="588" fill="#5b6470">GPIO4</text>
    <text x="574" y="621" fill="#cbd5e1" font-weight="bold">GPIO0  ● BOOT (interno)</text>
    <text x="574" y="654" fill="#cbd5e1" font-weight="bold">GPIO2  ● LED (interno)</text>
    <text x="574" y="687" fill="#5b6470">GPIO15</text>
    <text x="574" y="720" fill="#5b6470">GPIO8</text>
    <text x="574" y="753" fill="#5b6470">GPIO7</text>
    <text x="574" y="786" fill="#5b6470">GPIO6</text>
  </g>

  <!-- ===== PANEL DE CONEXIONES (derecha) ===== -->
  <rect x="700" y="120" width="268" height="500" rx="6" fill="#1a1d24" stroke="#3a3e48" stroke-width="1"/>
  <text x="834" y="140" fill="#f1f5f9" font-size="10" text-anchor="middle" font-weight="bold">Conexiones por módulo</text>

  <rect x="712" y="152" width="10" height="10" fill="#22d3ee"/>
  <text x="728" y="161" fill="#22d3ee" font-size="10" font-weight="bold">CC1101 — 433MHz (SPI, 3.3V)</text>
  <g font-size="9" fill="#e6e6e6">
    <text x="722" y="178">1 GND       → GND</text>
    <text x="722" y="192">2 VDD       → 3V3</text>
    <text x="722" y="206">3 GDO0      → GPIO27  (RX)</text>
    <text x="722" y="220">4 CSN       → GPIO5</text>
    <text x="722" y="234">5 SCK       → GPIO18</text>
    <text x="722" y="248">6 MOSI      → GPIO23</text>
    <text x="722" y="262">7 MISO/GDO1 → GPIO19</text>
    <text x="722" y="276">8 GDO2      → GPIO32  (TX)</text>
    <text x="722" y="290" fill="#94a3b8">ANT → conector SMA (enrosca antena)</text>
  </g>

  <rect x="712" y="308" width="10" height="10" fill="#3b82f6"/>
  <text x="728" y="317" fill="#3b82f6" font-size="10" font-weight="bold">Módulo Relay — 1 canal (5V)</text>
  <g font-size="9" fill="#e6e6e6">
    <text x="722" y="334">VCC → 5V</text>
    <text x="722" y="348">GND → GND</text>
    <text x="722" y="362">IN  → GPIO26</text>
    <text x="722" y="376" fill="#94a3b8">OUT → motor / portón</text>
  </g>

  <rect x="712" y="394" width="10" height="10" fill="#c084fc"/>
  <text x="728" y="403" fill="#c084fc" font-size="10" font-weight="bold">DS3231 — RTC (opcional, 3.3V)</text>
  <g font-size="9" fill="#e6e6e6">
    <text x="722" y="420">VCC → 3V3</text>
    <text x="722" y="434">GND → GND</text>
    <text x="722" y="448">SDA → GPIO21</text>
    <text x="722" y="462">SCL → GPIO22</text>
  </g>

  <rect x="712" y="480" width="10" height="10" fill="#22c55e"/>
  <text x="728" y="489" fill="#22c55e" font-size="10" font-weight="bold">Antenas</text>
  <g font-size="9" fill="#e6e6e6">
    <text x="722" y="506">WiFi 2.4GHz → conector U.FL del -32U</text>
    <text x="722" y="520" fill="#94a3b8">(pigtail U.FL→SMA + antena 2.4GHz)</text>
    <text x="722" y="534">433MHz → antena SMA enroscada</text>
    <text x="722" y="548" fill="#94a3b8">al conector del CC1101 (este módulo)</text>
  </g>

  <text x="722" y="576" fill="#f59e0b" font-size="8">⚠ Fuente 5V sólida: a máxima potencia el pico</text>
  <text x="722" y="586" fill="#f59e0b" font-size="8">   de corriente sube (evita brownout).</text>
  <text x="722" y="604" fill="#94a3b8" font-size="8">GPIO0/GPIO2 son internos: no cablear nada.</text>

  <!-- ===== TIP SOLDADURA ===== -->
  <rect x="20" y="626" width="660" height="180" rx="6" fill="#12161d" stroke="#3a3e48" stroke-width="1"/>
  <text x="34" y="648" fill="#22c55e" font-size="11" font-weight="bold">Guía rápida de soldadura (por lado del header)</text>
  <text x="34" y="670" fill="#e2e8f0" font-size="9" font-weight="bold">LADO IZQUIERDO:</text>
  <g font-size="9" fill="#e6e6e6">
    <text x="44" y="686">• 3V3 (arriba) → VCC de CC1101 y DS3231</text>
    <text x="44" y="700">• GPIO32 → GDO2 (TX) · GPIO27 → GDO0 (RX) · GPIO26 → Relay IN</text>
    <text x="44" y="714">• GND · 5V(VIN, abajo) → Fuente / Relay VCC</text>
  </g>
  <text x="34" y="738" fill="#e2e8f0" font-size="9" font-weight="bold">LADO DERECHO:</text>
  <g font-size="9" fill="#e6e6e6">
    <text x="44" y="754">• SPI junto: GPIO23 MOSI · GPIO19 MISO · GPIO18 SCK · GPIO5 CSN → CC1101</text>
    <text x="44" y="768">• I2C: GPIO21 SDA · GPIO22 SCL → DS3231 (opcional)</text>
    <text x="44" y="782">• GPIO0 (BOOT) y GPIO2 (LED) ya son internos (no cablear)</text>
  </g>
  <text x="34" y="800" fill="#94a3b8" font-size="8">Orden sugerido: 1) alimentación 3V3/5V/GND · 2) SPI (derecha) · 3) GDO0/GDO2/Relay (izquierda).</text>

</svg>
</body>
</html>
