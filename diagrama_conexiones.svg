<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 690" width="820" height="690" style="font-family:monospace,sans-serif">

  <!-- Fondo -->
  <rect width="820" height="690" fill="#0f1115"/>

  <!-- Título -->
  <text x="410" y="28" fill="#4ade80" font-size="15" text-anchor="middle" font-weight="bold">Portón 433MHz — Diagrama de conexiones</text>

  <!-- ═══ BUS 5V ═══ -->
  <line x1="8" y1="50" x2="760" y2="50" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="765" y="55" fill="#e74c3c" font-size="11" font-weight="bold">5V</text>

  <!-- ═══ BUS 3.3V ═══ -->
  <line x1="8" y1="75" x2="760" y2="75" stroke="#f97316" stroke-width="2.5"/>
  <text x="765" y="80" fill="#f97316" font-size="11" font-weight="bold">3V3</text>

  <!-- ═══ BUS GND ═══ -->
  <line x1="8" y1="650" x2="760" y2="650" stroke="#777" stroke-width="2.5"/>
  <text x="765" y="655" fill="#777" font-size="11" font-weight="bold">GND</text>

  <!-- ════════════ FUENTE 5V ════════════ -->
  <rect x="25" y="35" width="90" height="36" rx="5" fill="#1a1d24" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="70" y="49" fill="#e6e6e6" font-size="9" text-anchor="middle">Fuente</text>
  <text x="70" y="62" fill="#e74c3c" font-size="9" text-anchor="middle">5V / 1A</text>

  <!-- ════════════ MX-RM-5V ════════════ -->
  <rect x="25" y="130" width="130" height="115" rx="6" fill="#1e2430" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="90" y="150" fill="#fbbf24" font-size="11" text-anchor="middle" font-weight="bold">MX-RM-5V</text>
  <text x="90" y="163" fill="#888" font-size="8" text-anchor="middle">Receptor 433MHz</text>
  <text x="118" y="184" fill="#888" font-size="9">ANT</text>
  <text x="118" y="202" fill="#e74c3c" font-size="9">VCC</text>
  <line x1="155" y1="198" x2="175" y2="198" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="118" y="220" fill="#777" font-size="9">GND</text>
  <line x1="155" y1="216" x2="175" y2="216" stroke="#777" stroke-width="1.8"/>
  <text x="118" y="238" fill="#4ade80" font-size="9">DATA</text>
  <line x1="155" y1="234" x2="200" y2="234" stroke="#4ade80" stroke-width="1.8"/>
  <!-- Antena -->
  <line x1="25" y1="180" x2="10" y2="133" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1" y="129" fill="#555" font-size="8">17cm</text>
  <!-- MX VCC → 5V bus -->
  <polyline points="175,198 175,50" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="175" cy="50" r="3.5" fill="#e74c3c"/>
  <!-- MX GND → GND bus -->
  <polyline points="175,216 175,650" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="175" cy="650" r="3.5" fill="#777"/>

  <!-- ════════════ DS3231 ════════════ -->
  <rect x="25" y="288" width="150" height="130" rx="6" fill="#1e2430" stroke="#a855f7" stroke-width="1.8"/>
  <text x="100" y="309" fill="#a855f7" font-size="11" text-anchor="middle" font-weight="bold">DS3231</text>
  <text x="100" y="322" fill="#888" font-size="8" text-anchor="middle">Reloj RTC (opcional)</text>
  <!-- DS3231 pines izquierda -->
  <text x="32" y="348" fill="#f97316" font-size="9">VCC 3.3V</text>
  <line x1="25" y1="344" x2="15" y2="344" stroke="#f97316" stroke-width="1.8"/>
  <text x="32" y="372" fill="#777" font-size="9">GND</text>
  <line x1="25" y1="368" x2="8" y2="368" stroke="#777" stroke-width="1.8"/>
  <!-- DS3231 pines derecha -->
  <text x="128" y="397" fill="#a855f7" font-size="9">SDA</text>
  <line x1="175" y1="393" x2="310" y2="393" stroke="#a855f7" stroke-width="1.8"/>
  <text x="128" y="415" fill="#a855f7" font-size="9">SCL</text>
  <line x1="175" y1="411" x2="310" y2="411" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="6,3"/>
  <!-- DS3231 VCC → 3.3V bus (x=15, sube) -->
  <polyline points="15,344 15,75" fill="none" stroke="#f97316" stroke-width="1.8"/>
  <circle cx="15" cy="75" r="3.5" fill="#f97316"/>
  <!-- DS3231 GND → GND bus (x=8, baja) -->
  <polyline points="8,368 8,650" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="8" cy="650" r="3.5" fill="#777"/>
  <!-- Nota x cruce R2 GND en x=278 (distinto color = sin conexión) -->

  <!-- ════════════ DIVISOR DE TENSIÓN ════════════ -->
  <rect x="200" y="225" width="56" height="17" rx="4" fill="#4a3000" stroke="#c8961e" stroke-width="1.2"/>
  <text x="228" y="237" fill="#fbbf24" font-size="8" text-anchor="middle">R1 10kΩ</text>
  <line x1="256" y1="234" x2="278" y2="234" stroke="#4ade80" stroke-width="1.8"/>
  <circle cx="278" cy="234" r="4.5" fill="#4ade80"/>
  <line x1="278" y1="234" x2="310" y2="234" stroke="#4ade80" stroke-width="1.8"/>
  <line x1="278" y1="234" x2="278" y2="253" stroke="#4ade80" stroke-width="1.8"/>
  <rect x="269" y="253" width="17" height="58" rx="4" fill="#4a3000" stroke="#c8961e" stroke-width="1.2"/>
  <text x="278" y="287" fill="#fbbf24" font-size="8" text-anchor="middle" writing-mode="tb">R2 10kΩ</text>
  <line x1="278" y1="311" x2="278" y2="650" stroke="#777" stroke-width="1.8"/>
  <circle cx="278" cy="650" r="3.5" fill="#777"/>

  <!-- ════════════ ESP32 ════════════ -->
  <rect x="310" y="90" width="165" height="450" rx="8" fill="#1e2430" stroke="#4ade80" stroke-width="2"/>
  <text x="392" y="113" fill="#4ade80" font-size="13" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="392" y="128" fill="#888" font-size="9" text-anchor="middle">WROOM DevKit</text>
  <!-- Pines izquierda -->
  <text x="316" y="161" fill="#e74c3c" font-size="9">VIN</text>
  <line x1="290" y1="157" x2="310" y2="157" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="316" y="183" fill="#f97316" font-size="9">3V3</text>
  <line x1="283" y1="179" x2="310" y2="179" stroke="#f97316" stroke-width="1.8"/>
  <text x="316" y="205" fill="#777" font-size="9">GND</text>
  <line x1="297" y1="201" x2="310" y2="201" stroke="#777" stroke-width="1.8"/>
  <text x="316" y="238" fill="#4ade80" font-size="9">GPIO27</text>
  <text x="316" y="263" fill="#777" font-size="9">GPIO2  ● LED</text>
  <text x="316" y="283" fill="#777" font-size="9">GPIO0  ● BOOT</text>
  <text x="316" y="397" fill="#a855f7" font-size="9">GPIO21 SDA</text>
  <text x="316" y="415" fill="#a855f7" font-size="9">GPIO22 SCL</text>
  <!-- Pin derecho GPIO26 -->
  <text x="386" y="335" fill="#3b82f6" font-size="9">GPIO26</text>
  <line x1="475" y1="331" x2="530" y2="331" stroke="#3b82f6" stroke-width="1.8"/>
  <!-- VIN → 5V bus -->
  <polyline points="290,157 290,50" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="290" cy="50" r="3.5" fill="#e74c3c"/>
  <!-- 3V3 → 3.3V bus -->
  <polyline points="283,179 283,75" fill="none" stroke="#f97316" stroke-width="1.8"/>
  <circle cx="283" cy="75" r="3.5" fill="#f97316"/>
  <!-- GND → GND bus -->
  <polyline points="297,201 297,650" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="297" cy="650" r="3.5" fill="#777"/>

  <!-- ════════════ RELAY MODULE ════════════ -->
  <rect x="530" y="188" width="148" height="140" rx="6" fill="#1e2430" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="604" y="210" fill="#3b82f6" font-size="11" text-anchor="middle" font-weight="bold">Módulo Relay</text>
  <text x="604" y="224" fill="#888" font-size="8" text-anchor="middle">1 canal 5V</text>
  <text x="536" y="248" fill="#e74c3c" font-size="9">VCC</text>
  <line x1="505" y1="244" x2="530" y2="244" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="536" y="270" fill="#777" font-size="9">GND</text>
  <line x1="505" y1="266" x2="530" y2="266" stroke="#777" stroke-width="1.8"/>
  <text x="536" y="335" fill="#3b82f6" font-size="9">IN</text>
  <!-- Salida relay -->
  <line x1="678" y1="278" x2="720" y2="278" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="678" y1="296" x2="720" y2="296" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="724" y="282" fill="#888" font-size="8">→ Motor /</text>
  <text x="724" y="297" fill="#888" font-size="8">   Portón</text>
  <!-- Relay VCC → 5V bus -->
  <polyline points="505,244 505,50" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="505" cy="50" r="3.5" fill="#e74c3c"/>
  <!-- Relay GND → GND bus -->
  <polyline points="505,266 505,650" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="505" cy="650" r="3.5" fill="#777"/>

  <!-- ════════════ LEYENDA ════════════ -->
  <rect x="310" y="558" width="380" height="120" rx="6" fill="#1a1d24" stroke="#3a3e48" stroke-width="1"/>
  <text x="500" y="576" fill="#888" font-size="10" text-anchor="middle" font-weight="bold">Referencias</text>
  <line x1="325" y1="589" x2="360" y2="589" stroke="#e74c3c" stroke-width="2.2"/>
  <text x="368" y="593" fill="#e6e6e6" font-size="9">5V — Fuente, MX-RM-5V VCC, Relay VCC, ESP32 VIN</text>
  <line x1="325" y1="607" x2="360" y2="607" stroke="#f97316" stroke-width="2.2"/>
  <text x="368" y="611" fill="#e6e6e6" font-size="9">3.3V — DS3231 VCC (ESP32 3V3 pin)</text>
  <line x1="325" y1="625" x2="360" y2="625" stroke="#777" stroke-width="2.2"/>
  <text x="368" y="629" fill="#e6e6e6" font-size="9">GND</text>
  <line x1="325" y1="643" x2="360" y2="643" stroke="#4ade80" stroke-width="2.2"/>
  <text x="368" y="647" fill="#e6e6e6" font-size="9">DATA 433MHz → divisor R1/R2 → GPIO27</text>
  <line x1="325" y1="658" x2="360" y2="658" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="368" y="662" fill="#e6e6e6" font-size="9">GPIO26 → Relay IN</text>
  <line x1="500" y1="643" x2="535" y2="643" stroke="#a855f7" stroke-width="2.2"/>
  <text x="543" y="647" fill="#e6e6e6" font-size="9">I2C SDA (GPIO21) — DS3231</text>
  <line x1="500" y1="658" x2="535" y2="658" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="6,3"/>
  <text x="543" y="662" fill="#e6e6e6" font-size="9">I2C SCL (GPIO22) — DS3231</text>

  <!-- Nota DS3231 -->
  <text x="530" y="390" fill="#a855f7" font-size="9">DS3231: SDA→GPIO21, SCL→GPIO22</text>
  <text x="530" y="405" fill="#888" font-size="8">VCC=3.3V  GND  (I2C default ESP32)</text>
  <rect x="526" y="378" width="240" height="35" rx="4" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,2"/>

</svg>
