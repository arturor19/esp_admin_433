<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" width="860" height="760" style="font-family:monospace,sans-serif">

  <!-- Fondo -->
  <rect width="860" height="760" fill="#0f1115"/>

  <!-- Título -->
  <text x="430" y="28" fill="#4ade80" font-size="15" text-anchor="middle" font-weight="bold">Portón 433MHz — Diagrama de conexiones (CC1101)</text>

  <!-- BUS 5V -->
  <line x1="8" y1="50" x2="800" y2="50" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="806" y="55" fill="#e74c3c" font-size="11" font-weight="bold">5V</text>

  <!-- BUS 3.3V -->
  <line x1="8" y1="75" x2="800" y2="75" stroke="#f97316" stroke-width="2.5"/>
  <text x="806" y="80" fill="#f97316" font-size="11" font-weight="bold">3V3</text>

  <!-- BUS GND -->
  <line x1="8" y1="720" x2="800" y2="720" stroke="#777" stroke-width="2.5"/>
  <text x="806" y="725" fill="#777" font-size="11" font-weight="bold">GND</text>

  <!-- FUENTE 5V -->
  <rect x="25" y="35" width="90" height="36" rx="5" fill="#1a1d24" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="70" y="49" fill="#e6e6e6" font-size="9" text-anchor="middle">Fuente</text>
  <text x="70" y="62" fill="#e74c3c" font-size="9" text-anchor="middle">5V / 1A</text>

  <!-- CC1101 -->
  <rect x="25" y="120" width="160" height="230" rx="6" fill="#1e2430" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="105" y="142" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="bold">CC1101</text>
  <text x="105" y="156" fill="#888" font-size="8" text-anchor="middle">Transceptor 433MHz (SPI)</text>

  <!-- pines del CC1101 — lado derecho -->
  <text x="115" y="182" font-size="9"><tspan fill="#555">2</tspan><tspan fill="#f97316"> VCC</tspan></text>
  <line x1="185" y1="178" x2="205" y2="178" stroke="#f97316" stroke-width="1.8"/>

  <text x="115" y="202" font-size="9"><tspan fill="#555">1</tspan><tspan fill="#777"> GND</tspan></text>
  <line x1="185" y1="198" x2="205" y2="198" stroke="#777" stroke-width="1.8"/>

  <text x="115" y="222" font-size="9"><tspan fill="#555">6</tspan><tspan fill="#e0a800"> MOSI(23)</tspan></text>
  <line x1="185" y1="218" x2="205" y2="218" stroke="#e0a800" stroke-width="1.8"/>

  <text x="115" y="242" font-size="9"><tspan fill="#555">7</tspan><tspan fill="#e0a800"> MISO(19)</tspan></text>
  <line x1="185" y1="238" x2="205" y2="238" stroke="#e0a800" stroke-width="1.8"/>

  <text x="115" y="262" font-size="9"><tspan fill="#555">5</tspan><tspan fill="#e0a800"> SCK (18)</tspan></text>
  <line x1="185" y1="258" x2="205" y2="258" stroke="#e0a800" stroke-width="1.8"/>

  <text x="115" y="282" font-size="9"><tspan fill="#555">4</tspan><tspan fill="#e0a800"> CSN (5)</tspan></text>
  <line x1="185" y1="278" x2="205" y2="278" stroke="#e0a800" stroke-width="1.8"/>

  <text x="115" y="302" font-size="9"><tspan fill="#555">3</tspan><tspan fill="#4ade80"> GDO0(27)RX</tspan></text>
  <line x1="185" y1="298" x2="205" y2="298" stroke="#4ade80" stroke-width="1.8"/>

  <text x="115" y="322" font-size="9"><tspan fill="#555">8</tspan><tspan fill="#14b8a6"> GDO2(32)TX</tspan></text>
  <line x1="185" y1="318" x2="205" y2="318" stroke="#14b8a6" stroke-width="1.8"/>

  <!-- Antena CC1101 -->
  <text x="30" y="352" fill="#888" font-size="9">ANT</text>
  <line x1="25" y1="165" x2="10" y2="120" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1" y="116" fill="#555" font-size="8">17cm</text>

  <!-- CC1101 VCC → 3.3V bus (cable rojo) -->
  <polyline points="205,178 215,178 215,75" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="215" cy="75" r="3.5" fill="#f97316"/>

  <!-- CC1101 GND → GND bus (cable café) -->
  <polyline points="205,198 220,198 220,720" fill="none" stroke="#8d6748" stroke-width="1.8"/>
  <circle cx="220" cy="720" r="3.5" fill="#777"/>

  <!-- SPI wires (MOSI, MISO, SCK, CSN) → colores cables físicos -->
  <!-- MOSI 23 (azul) -->
  <polyline points="205,218 240,218 240,355" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <polyline points="240,355 310,355" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- MISO 19 (blanco) -->
  <polyline points="205,238 245,238 245,373" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polyline points="245,373 310,373" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- SCK 18 (verde) -->
  <polyline points="205,258 250,258 250,391" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <polyline points="250,391 310,391" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <!-- CSN 5 (amarillo) -->
  <polyline points="205,278 255,278 255,409" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polyline points="255,409 310,409" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- GDO0 → GPIO27 (naranja) -->
  <polyline points="205,298 260,298 260,240" fill="none" stroke="#fb923c" stroke-width="1.8"/>
  <polyline points="260,240 310,240" fill="none" stroke="#fb923c" stroke-width="1.8"/>
  <!-- GDO2 → GPIO32 (gris) -->
  <polyline points="205,318 265,318 265,302" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <polyline points="265,302 310,302" fill="none" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- DS3231 -->
  <rect x="25" y="390" width="150" height="130" rx="6" fill="#1e2430" stroke="#a855f7" stroke-width="1.8"/>
  <text x="100" y="411" fill="#a855f7" font-size="11" text-anchor="middle" font-weight="bold">DS3231</text>
  <text x="100" y="424" fill="#888" font-size="8" text-anchor="middle">Reloj RTC (opcional)</text>
  <text x="32" y="450" fill="#f97316" font-size="9">VCC 3.3V</text>
  <line x1="25" y1="446" x2="15" y2="446" stroke="#f97316" stroke-width="1.8"/>
  <text x="32" y="474" fill="#777" font-size="9">GND</text>
  <line x1="25" y1="470" x2="8" y2="470" stroke="#777" stroke-width="1.8"/>
  <text x="128" y="499" fill="#a855f7" font-size="9">SDA</text>
  <line x1="175" y1="495" x2="310" y2="495" stroke="#a855f7" stroke-width="1.8"/>
  <text x="128" y="517" fill="#a855f7" font-size="9">SCL</text>
  <line x1="175" y1="513" x2="310" y2="513" stroke="#a855f7" stroke-width="1.8"/>
  <!-- DS3231 VCC → 3.3V bus -->
  <polyline points="15,446 15,75" fill="none" stroke="#f97316" stroke-width="1.8"/>
  <circle cx="15" cy="75" r="3.5" fill="#f97316"/>
  <!-- DS3231 GND → GND bus -->
  <polyline points="8,470 8,720" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="8" cy="720" r="3.5" fill="#777"/>

  <!-- ESP32 -->
  <rect x="310" y="90" width="170" height="510" rx="8" fill="#1e2430" stroke="#4ade80" stroke-width="2"/>
  <text x="395" y="113" fill="#4ade80" font-size="13" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="395" y="128" fill="#888" font-size="9" text-anchor="middle">WROOM DevKit</text>

  <!-- Pines izquierda ESP32 -->
  <text x="316" y="161" fill="#e74c3c" font-size="9">VIN</text>
  <line x1="290" y1="157" x2="310" y2="157" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="316" y="183" fill="#f97316" font-size="9">3V3</text>
  <line x1="283" y1="179" x2="310" y2="179" stroke="#f97316" stroke-width="1.8"/>
  <text x="316" y="205" fill="#777" font-size="9">GND</text>
  <line x1="297" y1="201" x2="310" y2="201" stroke="#777" stroke-width="1.8"/>

  <text x="316" y="243" fill="#fb923c" font-size="9">GPIO27 GDO0-RX</text>
  <text x="316" y="265" fill="#777" font-size="9">GPIO2  ● LED</text>
  <text x="316" y="283" fill="#777" font-size="9">GPIO0  ● BOOT</text>
  <text x="316" y="305" fill="#14b8a6" font-size="9">GPIO32 GDO2-TX</text>
  <text x="316" y="358" fill="#e0a800" font-size="9">GPIO23 MOSI</text>
  <text x="316" y="376" fill="#e0a800" font-size="9">GPIO19 MISO</text>
  <text x="316" y="394" fill="#e0a800" font-size="9">GPIO18 SCK</text>
  <text x="316" y="412" fill="#e0a800" font-size="9">GPIO5  CSN</text>
  <text x="316" y="498" fill="#a855f7" font-size="9">GPIO21 SDA</text>
  <text x="316" y="516" fill="#a855f7" font-size="9">GPIO22 SCL</text>

  <!-- Pines derecha ESP32 -->
  <text x="400" y="462" fill="#3b82f6" font-size="9" text-anchor="end">GPIO26 ●</text>
  <line x1="464" y1="457" x2="480" y2="457" stroke="#3b82f6" stroke-width="1.8"/>

  <!-- VIN → 5V bus -->
  <polyline points="290,157 290,50" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="290" cy="50" r="3.5" fill="#e74c3c"/>
  <!-- 3V3 → 3.3V bus -->
  <polyline points="283,179 283,75" fill="none" stroke="#f97316" stroke-width="1.8"/>
  <circle cx="283" cy="75" r="3.5" fill="#f97316"/>
  <!-- GND → GND bus -->
  <polyline points="297,201 297,720" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="297" cy="720" r="3.5" fill="#777"/>

  <!-- RELAY MODULE -->
  <rect x="540" y="330" width="148" height="155" rx="6" fill="#1e2430" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="614" y="352" fill="#3b82f6" font-size="11" text-anchor="middle" font-weight="bold">Módulo Relay</text>
  <text x="614" y="366" fill="#888" font-size="8" text-anchor="middle">1 canal 5V</text>
  <!-- Salida relay (contactos) -->
  <line x1="688" y1="385" x2="730" y2="385" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="688" y1="403" x2="730" y2="403" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="734" y="389" fill="#888" font-size="8">→ Motor /</text>
  <text x="734" y="407" fill="#888" font-size="8">   Portón</text>
  <text x="546" y="418" fill="#e74c3c" font-size="9">VCC</text>
  <line x1="510" y1="414" x2="540" y2="414" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="546" y="438" fill="#777" font-size="9">GND</text>
  <line x1="510" y1="434" x2="540" y2="434" stroke="#777" stroke-width="1.8"/>
  <text x="546" y="461" fill="#3b82f6" font-size="9">IN</text>
  <line x1="480" y1="457" x2="540" y2="457" stroke="#3b82f6" stroke-width="1.8"/>
  <!-- Relay VCC → 5V bus -->
  <polyline points="510,414 510,50" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="510" cy="50" r="3.5" fill="#e74c3c"/>
  <!-- Relay GND → GND bus -->
  <polyline points="510,434 510,720" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="510" cy="720" r="3.5" fill="#777"/>

  <!-- LEYENDA -->
  <rect x="305" y="604" width="552" height="103" rx="6" fill="#1a1d24" stroke="#3a3e48" stroke-width="1"/>
  <text x="581" y="616" fill="#888" font-size="10" text-anchor="middle" font-weight="bold">Referencias (colores = cables físicos)</text>
  <!-- columna izquierda -->
  <line x1="315" y1="629" x2="350" y2="629" stroke="#e74c3c" stroke-width="2.2"/>
  <text x="356" y="633" fill="#e6e6e6" font-size="9">5V — Fuente, Relay VCC, ESP32 VIN</text>
  <line x1="315" y1="642" x2="350" y2="642" stroke="#f97316" stroke-width="2.2"/>
  <text x="356" y="646" fill="#e6e6e6" font-size="9">3.3V — CC1101 VCC, DS3231 VCC</text>
  <line x1="315" y1="655" x2="350" y2="655" stroke="#777" stroke-width="2.2"/>
  <text x="356" y="659" fill="#e6e6e6" font-size="9">GND común</text>
  <line x1="315" y1="668" x2="350" y2="668" stroke="#8d6748" stroke-width="2.2"/>
  <text x="356" y="672" fill="#e6e6e6" font-size="9">CC1101 GND — café</text>
  <line x1="315" y1="681" x2="350" y2="681" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="356" y="685" fill="#e6e6e6" font-size="9">GPIO26 → Relay IN</text>
  <line x1="315" y1="694" x2="350" y2="694" stroke="#a855f7" stroke-width="2.2"/>
  <text x="356" y="698" fill="#e6e6e6" font-size="9">I2C SDA/SCL → DS3231</text>
  <!-- columna derecha (señales CC1101) -->
  <line x1="548" y1="629" x2="583" y2="629" stroke="#fb923c" stroke-width="2.2"/>
  <text x="589" y="633" fill="#e6e6e6" font-size="9">GPIO27 GDO0 → RX 433MHz</text>
  <line x1="548" y1="642" x2="583" y2="642" stroke="#94a3b8" stroke-width="2.2"/>
  <text x="589" y="646" fill="#e6e6e6" font-size="9">GPIO32 GDO2 → TX 433MHz</text>
  <line x1="548" y1="655" x2="583" y2="655" stroke="#60a5fa" stroke-width="2.2"/>
  <text x="589" y="659" fill="#e6e6e6" font-size="9">GPIO23 MOSI — azul</text>
  <line x1="548" y1="668" x2="583" y2="668" stroke="#e0e0e0" stroke-width="2.2"/>
  <text x="589" y="672" fill="#e6e6e6" font-size="9">GPIO19 MISO — blanco</text>
  <line x1="548" y1="681" x2="583" y2="681" stroke="#4ade80" stroke-width="2.2"/>
  <text x="589" y="685" fill="#e6e6e6" font-size="9">GPIO18 SCK — verde</text>
  <line x1="548" y1="694" x2="583" y2="694" stroke="#fbbf24" stroke-width="2.2"/>
  <text x="589" y="698" fill="#e6e6e6" font-size="9">GPIO5 CSN — amarillo</text>

</svg>
