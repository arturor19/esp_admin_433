<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portón 433MHz — Diagrama de conexiones</title>
<style>body{background:#0f1115;margin:0;display:flex;justify-content:center;padding:20px;}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" style="font-family:monospace,sans-serif">

  <!-- Fondo -->
  <rect width="780" height="500" fill="#0f1115"/>

  <!-- Título -->
  <text x="390" y="28" fill="#4ade80" font-size="15" text-anchor="middle" font-weight="bold">Portón 433MHz — Diagrama de conexiones</text>

  <!-- ═══ BUS 5V (línea roja superior) ═══ -->
  <line x1="55" y1="55" x2="670" y2="55" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="686" y="60" fill="#e74c3c" font-size="11" font-weight="bold">5V</text>

  <!-- ═══ BUS GND (línea gris inferior) ═══ -->
  <line x1="55" y1="450" x2="670" y2="450" stroke="#777" stroke-width="2.5"/>
  <text x="686" y="455" fill="#777" font-size="11" font-weight="bold">GND</text>

  <!-- ════════════ FUENTE 5V ════════════ -->
  <rect x="25" y="38" width="90" height="36" rx="5" fill="#1a1d24" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="70" y="52" fill="#e6e6e6" font-size="9" text-anchor="middle">Fuente</text>
  <text x="70" y="65" fill="#e74c3c" font-size="9" text-anchor="middle">5V / 1A</text>

  <!-- ════════════ MX-RM-5V ════════════ -->
  <rect x="25" y="130" width="130" height="115" rx="6" fill="#1e2430" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="90" y="150" fill="#fbbf24" font-size="11" text-anchor="middle" font-weight="bold">MX-RM-5V</text>
  <text x="90" y="163" fill="#888" font-size="8" text-anchor="middle">Receptor 433MHz</text>

  <!-- Pines MX-RM-5V (derecha) -->
  <text x="118" y="182" fill="#888" font-size="9">ANT</text>
  <text x="118" y="200" fill="#e74c3c" font-size="9">VCC</text>
  <line x1="155" y1="196" x2="172" y2="196" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="118" y="218" fill="#777" font-size="9">GND</text>
  <line x1="155" y1="214" x2="172" y2="214" stroke="#777" stroke-width="1.8"/>
  <text x="118" y="236" fill="#4ade80" font-size="9">DATA</text>
  <line x1="155" y1="232" x2="190" y2="232" stroke="#4ade80" stroke-width="1.8"/>

  <!-- Antena (hilo 17cm) -->
  <line x1="25" y1="178" x2="10" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="2" y="125" fill="#555" font-size="8">17cm</text>

  <!-- MX VCC → bus 5V -->
  <polyline points="172,196 172,55" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="172" cy="55" r="3.5" fill="#e74c3c"/>

  <!-- MX GND → bus GND -->
  <polyline points="172,214 172,450" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="172" cy="450" r="3.5" fill="#777"/>

  <!-- ════════════ DIVISOR DE TENSIÓN ════════════ -->
  <!-- R1 horizontal (10kΩ) -->
  <rect x="190" y="223" width="56" height="17" rx="4" fill="#4a3000" stroke="#c8961e" stroke-width="1.2"/>
  <text x="218" y="235" fill="#fbbf24" font-size="8" text-anchor="middle">R1 10kΩ</text>

  <!-- Wire DATA → R1 ya está (desde MX) -->
  <!-- R1 → Nodo de unión -->
  <line x1="246" y1="231" x2="268" y2="231" stroke="#4ade80" stroke-width="1.8"/>

  <!-- Nodo de unión -->
  <circle cx="268" cy="231" r="4.5" fill="#4ade80"/>

  <!-- Nodo → GPIO27 (ESP32) -->
  <line x1="268" y1="231" x2="300" y2="231" stroke="#4ade80" stroke-width="1.8"/>

  <!-- R2 vertical (10kΩ) → GND -->
  <line x1="268" y1="231" x2="268" y2="252" stroke="#4ade80" stroke-width="1.8"/>
  <rect x="259" y="252" width="17" height="58" rx="4" fill="#4a3000" stroke="#c8961e" stroke-width="1.2"/>
  <text x="268" y="285" fill="#fbbf24" font-size="8" text-anchor="middle" writing-mode="tb">R2 10kΩ</text>
  <line x1="268" y1="310" x2="268" y2="450" stroke="#777" stroke-width="1.8"/>
  <circle cx="268" cy="450" r="3.5" fill="#777"/>

  <!-- ════════════ ESP32 ════════════ -->
  <rect x="300" y="75" width="165" height="370" rx="8" fill="#1e2430" stroke="#4ade80" stroke-width="2"/>
  <text x="382" y="98" fill="#4ade80" font-size="13" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="382" y="113" fill="#888" font-size="9" text-anchor="middle">WROOM DevKit</text>

  <!-- Pines izquierda -->
  <text x="306" y="142" fill="#e74c3c" font-size="9">VIN</text>
  <line x1="280" y1="138" x2="300" y2="138" stroke="#e74c3c" stroke-width="1.8"/>

  <text x="306" y="164" fill="#777" font-size="9">GND</text>
  <line x1="283" y1="160" x2="300" y2="160" stroke="#777" stroke-width="1.8"/>

  <text x="306" y="235" fill="#4ade80" font-size="9">GPIO27</text>
  <!-- GPIO27 ya conectado por nodo a R1/R2 -->

  <text x="306" y="270" fill="#777" font-size="9">GPIO2  ● LED</text>
  <text x="306" y="292" fill="#777" font-size="9">GPIO0  ● BOOT</text>

  <!-- Pin derecho: GPIO26 -->
  <text x="388" y="315" fill="#3b82f6" font-size="9">GPIO26</text>
  <line x1="465" y1="311" x2="510" y2="311" stroke="#3b82f6" stroke-width="1.8"/>

  <!-- VIN → bus 5V -->
  <polyline points="280,138 280,55" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="280" cy="55" r="3.5" fill="#e74c3c"/>

  <!-- GND → bus GND -->
  <polyline points="283,160 283,450" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="283" cy="450" r="3.5" fill="#777"/>

  <!-- ════════════ RELAY MODULE ════════════ -->
  <rect x="510" y="168" width="148" height="140" rx="6" fill="#1e2430" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="584" y="190" fill="#3b82f6" font-size="11" text-anchor="middle" font-weight="bold">Módulo Relay</text>
  <text x="584" y="204" fill="#888" font-size="8" text-anchor="middle">1 canal 5V</text>

  <!-- Pines relay izquierda -->
  <text x="516" y="226" fill="#e74c3c" font-size="9">VCC</text>
  <line x1="492" y1="222" x2="510" y2="222" stroke="#e74c3c" stroke-width="1.8"/>

  <text x="516" y="248" fill="#777" font-size="9">GND</text>
  <line x1="492" y1="244" x2="510" y2="244" stroke="#777" stroke-width="1.8"/>

  <text x="516" y="315" fill="#3b82f6" font-size="9">IN</text>
  <!-- IN ya conectado por GPIO26 (llega desde derecha de ESP32 a y=311) -->
  <line x1="510" y1="311" x2="510" y2="311" stroke="#3b82f6" stroke-width="1.8"/>

  <!-- Salida relay (derecha) con terminales -->
  <line x1="658" y1="260" x2="700" y2="260" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="658" y1="278" x2="700" y2="278" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="568" y="265" fill="#888" font-size="8">COM</text>
  <text x="608" y="265" fill="#888" font-size="8">NO</text>
  <text x="703" y="264" fill="#888" font-size="8">→ Motor /</text>
  <text x="703" y="278" fill="#888" font-size="8">   Portón</text>

  <!-- Relay VCC → bus 5V -->
  <polyline points="492,222 492,55" fill="none" stroke="#e74c3c" stroke-width="1.8"/>
  <circle cx="492" cy="55" r="3.5" fill="#e74c3c"/>

  <!-- Relay GND → bus GND -->
  <polyline points="492,244 492,450" fill="none" stroke="#777" stroke-width="1.8"/>
  <circle cx="492" cy="450" r="3.5" fill="#777"/>

  <!-- ════════════ LEYENDA ════════════ -->
  <rect x="25" y="380" width="245" height="105" rx="6" fill="#1a1d24" stroke="#3a3e48" stroke-width="1"/>
  <text x="147" y="398" fill="#888" font-size="10" text-anchor="middle" font-weight="bold">Referencias</text>
  <line x1="40" y1="412" x2="80" y2="412" stroke="#e74c3c" stroke-width="2.2"/>
  <text x="88" y="416" fill="#e6e6e6" font-size="9">5V / VCC</text>
  <line x1="40" y1="430" x2="80" y2="430" stroke="#777" stroke-width="2.2"/>
  <text x="88" y="434" fill="#e6e6e6" font-size="9">GND</text>
  <line x1="40" y1="448" x2="80" y2="448" stroke="#4ade80" stroke-width="2.2"/>
  <text x="88" y="452" fill="#e6e6e6" font-size="9">Señal DATA (con divisor R1/R2)</text>
  <line x1="40" y1="466" x2="80" y2="466" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="88" y="470" fill="#e6e6e6" font-size="9">GPIO26 → Relay IN</text>
  <line x1="40" y1="476" x2="80" y2="476" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="88" y="480" fill="#e6e6e6" font-size="9">Salida relay (al motor del portón)</text>

</svg>
</body>
</html>
