; PlatformIO — ESP32 Dev Module para el control de porton 433MHz

; Compilar:      pio run
; Compilar+subir: pio run -t upload
; Monitor serie:  pio device monitor   (o: pio run -t upload -t monitor)

[env:esp32dev]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

monitor_speed = 115200
; 115200 = maxima fiabilidad de grabado (sube a 460800/921600 si el cable/puerto lo permiten)
upload_speed  = 115200

; Filesystem LittleFS (persistencia de users/logs/admins/etc.)
board_build.filesystem = littlefs

lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib @ ^2.5.7
    sui77/rc-switch @ ^2.6.4
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/RTClib @ ^2.1.4

; Auto-test del ESP32 — NO es el firmware del porton.
; Comprueba si los GPIO y el SPI que usa el CC1101 siguen sanos.
;   pio run -e diag -t upload      (correr el test)
;   pio run -e esp32dev -t upload  (volver al firmware normal)
[env:diag]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 115200
build_src_filter = -<*> +<../diag/>
